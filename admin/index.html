<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Website editor — WCAA NJ &amp; Southeastern PA Chapter</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<main id="signin" hidden>
  <form id="signin-form" class="signin-card">
    <img class="signin-logo" src="../assets/wcaa-logo.png" alt="WCAA" width="60" height="60">
    <h1>Website editor</h1>
    <p class="hint">Sign in to change the chapter website.</p>
    <p class="status status--good" id="signin-note" role="status" hidden>You’re logged out. It’s safe to leave this computer.</p>
    <label class="field">
      <span class="field-label">Username</span>
      <input class="input" id="username" name="username" type="text" autocomplete="username" autocapitalize="none" required>
    </label>
    <label class="field">
      <span class="field-label">Password</span>
      <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
    </label>
    <!-- Shown once the password is right and the sign-in code (2FA) is on. -->
    <label class="field" id="code-field" hidden>
      <span class="field-label">Code from your authenticator app</span>
      <input class="input input--code" id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" autocapitalize="none" spellcheck="false">
      <span class="field-hint">Phone lost? Type one of your recovery codes instead.</span>
    </label>
    <button class="btn btn--primary" type="submit">Sign in</button>
    <p class="status status--bad" id="signin-error" role="alert"></p>
  </form>
</main>

<div id="app" hidden>
  <header class="bar">
    <img class="bar-logo" src="../assets/wcaa-logo.png" alt="" width="36" height="36">
    <span class="bar-title">Website editor</span>
    <nav class="modes" aria-label="What to work on">
      <button class="mode is-on" id="mode-content" type="button" aria-pressed="true">Change the website</button>
      <button class="mode" id="mode-events" type="button" aria-pressed="false">Event sign-ups</button>
      <button class="mode" id="mode-security" type="button" aria-pressed="false">Sign-in code</button>
    </nav>
    <button class="bar-save" id="save-top" type="button" disabled>Save changes</button>
    <button class="logout" id="logout" type="button">Log out</button>
  </header>

  <main id="content-view">
    <div class="toolbar">
      <label class="page-pick">
        <span>Page you’re changing:</span>
        <select class="input" id="page-select"></select>
      </label>
      <button class="btn btn--quiet" id="open-layout" type="button">Add or move sections</button>
    </div>
    <p class="hint-strip" id="hint"><strong>Click any words on the page to change them.</strong>
      To change a photo, a button or an event’s details, click it.</p>
    <div class="stage">
      <!-- Rendered by js/blocks.js, the same code the server uses when you save. -->
      <iframe id="preview" title="The page you are changing"></iframe>
    </div>
  </main>

  <!-- Details for the one thing that was clicked: an event, a photo, a button... -->
  <aside class="drawer" id="drawer" aria-labelledby="drawer-title" hidden>
    <div class="drawer-head">
      <h2 id="drawer-title"></h2>
      <button class="btn btn--primary" id="drawer-close" type="button">Done</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <footer class="savebar" id="savebar">
    <p class="status" id="status" role="status">Everything is saved.</p>
    <div class="savebar-actions">
      <button class="btn btn--quiet" id="discard" type="button" disabled>Discard changes</button>
      <button class="btn btn--primary" id="save" type="button" disabled>Save changes</button>
    </div>
  </footer>

  <!-- Someone else saved and both of you reshaped the same list: she picks which to keep (app.js askWhichList). -->
  <dialog class="clash" id="clash" aria-labelledby="clash-title">
    <h2 id="clash-title" tabindex="-1" autofocus>Someone else changed the same list</h2>   <!-- focus here, so a stray Enter picks neither -->
    <p id="clash-text"></p>
    <div class="clash-actions">
      <button class="btn btn--quiet" id="clash-theirs" type="button">Use their version<small>Your changes to it are dropped</small></button>
      <button class="btn btn--primary" id="clash-mine" type="button">Keep my version<small>It replaces their changes to it</small></button>
    </div>
  </dialog>

  <!-- Who registered for what. Lives in the database, never in the website's files. -->
  <main class="events-view" id="events-view" hidden></main>

  <!-- The sign-in code (2FA): set up, add a phone, switch off. app.js loadSecurity. -->
  <main class="events-view" id="security-view" hidden></main>
</div>

<script src="../vendor/qrcode.js"></script>   <!-- qrcode-generator 1.4.4, MIT: draws the setup QR in the browser, nothing leaves the page -->
<script type="module" src="app.js"></script>
</body>
</html>
